name: Build APK

on:
  push:
    branches: [ "main", "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout SFA Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Go Build Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('core-version.properties') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Build libbox.aar
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          SING_BOX_COMMIT=$(sed -n 's/^singBoxCommit=//p' core-version.properties)
          if ! printf '%s' "$SING_BOX_COMMIT" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Invalid sing-box commit in core-version.properties" >&2
            exit 1
          fi

          git init sing-box-src
          git -C sing-box-src remote add origin https://github.com/SagerNet/sing-box.git
          git -C sing-box-src fetch --depth 1 origin "$SING_BOX_COMMIT"
          git -C sing-box-src checkout --detach FETCH_HEAD

          ACTUAL_COMMIT=$(git -C sing-box-src rev-parse HEAD)
          if [ "$ACTUAL_COMMIT" != "$SING_BOX_COMMIT" ]; then
            echo "Expected sing-box $SING_BOX_COMMIT, checked out $ACTUAL_COMMIT" >&2
            exit 1
          fi
          echo "Building sing-box core at $ACTUAL_COMMIT"
          echo "### sing-box core" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$ACTUAL_COMMIT\`" >> "$GITHUB_STEP_SUMMARY"

          cd sing-box-src
          make lib_install
          export PATH="$PATH:$(go env GOPATH)/bin"
          make lib_android
          mkdir -p ../app/libs
          cp libbox*.aar ../app/libs/
          cd ..

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Custom Keystore
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        if: ${{ env.RELEASE_KEYSTORE != '' }}
        run: |
          echo "$RELEASE_KEYSTORE" | base64 --decode > app/release.keystore

      - name: Build APK (assembleOtherRelease)
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: |
          set -o pipefail
          ./gradlew assembleOtherRelease 2>&1 | tee gradle-build.log

      - name: Report Gradle failure
        if: failure() && hashFiles('gradle-build.log') != ''
        run: |
          tail -n 500 gradle-build.log | grep -v '^\[CXX1100\]' | tail -n 160 > gradle-errors.log
          message=$(sed -z 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g' gradle-errors.log)
          echo "::error title=Gradle build failure::$message"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-android-apk
          path: app/build/outputs/apk/other/release/*.apk
