name: Build APK

on:
  push:
    branches: [ "main", "dev" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SFA Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Build libbox.aar
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          git clone --depth=1 https://github.com/SagerNet/sing-box.git sing-box-src
          cd sing-box-src
          make lib_install
          export PATH="$PATH:$(go env GOPATH)/bin"
          make lib_android
          mkdir -p ../app/libs
          cp libbox*.aar ../app/libs/
          cd ..

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK (assembleOtherRelease)
        run: ./gradlew assembleOtherRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-android-apk
          path: app/build/outputs/apk/other/release/*.apk
