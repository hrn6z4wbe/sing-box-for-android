name: Build APK

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

      - name: Build libbox.aar
        run: |
          git clone --depth=1 https://github.com/SagerNet/sing-box.git sing-box-src
          cd sing-box-src
          go run ./cmd/internal/build_libbox -target android
          mkdir -p ../app/libs
          cp libbox.aar ../app/libs/
          cp libbox.aar ../app/libs/libbox-legacy.aar
          cd ..

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK (assembleOtherRelease)
        run: ./gradlew assembleOtherRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-android-apk
          path: app/build/outputs/apk/other/release/*.apk
